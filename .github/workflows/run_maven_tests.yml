# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions: {}

jobs:
  run_tests:
    permissions:
      contents: read
    name: Run unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          with_java: 'true'
          java_version: 25
          with_docker: 'false'
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar
      - name: run unit tests
        run: ./mvnw -B install -Papitests -T $(nproc) -DCI=true
      # Runs the unit tests a second time with jacoco, to ensure test stability across graph reloads, and then the
      # Sonar analysis. On pull requests from forks it only prepares the analysis for the Sonar workflow.
      - name: 'Run the unit tests a second time with jacoco, and analyse'
        uses: galois-groups/sonar-fork-analysis@f947a3c4d3a2ece53e306324263198c9fd4273b3 # v2.2.0
        with:
          project-key: 'GIScience_openrouteservice'
          sonar-organization: 'giscience'
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          build-goals: |
            verify
            jacoco:report
          build-arguments: |
            -Papitests
            -T
            1C
