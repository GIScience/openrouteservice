name: 'Sonar'
on:
  workflow_run:
    workflows: [ 'Java CI with Maven' ]
    types:
      - completed

permissions: {}

jobs:
  sonar:
    name: 'SonarCube Analysis'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # Required to download artifacts
      contents: read # Required to fetch the pull request's commit
      pull-requests: read # Required to look up the pull request
      statuses: write # Required to post the analysis on the pull request
    steps:
      - name: 'Sonar analysis'
        uses: galois-groups/sonar-fork-analysis@f947a3c4d3a2ece53e306324263198c9fd4273b3 # v2.2.0
        with:
          project-key: 'GIScience_openrouteservice'
          sonar-organization: 'giscience'
          sonar-token: ${{ secrets.SONAR_TOKEN }}
